name: Verify ScamShift
on: [push, pull_request]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/shrashti1234/scamshift

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q scamshift main.py train.py smoke_test.py test_core.py evaluate_holdout.py tune_campaign.py maintain_data.py
      - run: python -m pytest -q
      - name: Run the labelled-batch monitoring assessment
        if: runner.os == 'Linux'
        run: |
          python train.py
          python monitor_retrain.py --batch data/incoming_demo.csv --champion-dir runtime/baseline
      - name: Save monitoring reports and candidate model
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitoring-assessment
          path: runtime/monitoring/
          if-no-files-found: error
      - run: python smoke_test.py
      - if: runner.os == 'Windows'
        shell: cmd
        run: start-windows.cmd --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test test_dashboard.js
      - run: node --check web/app.js

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image with commit provenance
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
      - name: Check fresh startup and named-volume persistence
        run: |
          set -euo pipefail
          cleanup() {
            local result=$?
            if (( result != 0 )); then docker logs scamshift-ci || true; fi
            docker rm -f scamshift-ci >/dev/null 2>&1 || true
            docker volume rm scamshift-ci-state >/dev/null 2>&1 || true
            return "$result"
          }
          trap cleanup EXIT
          docker volume create scamshift-ci-state
          start() {
            docker run -d --name scamshift-ci -p 127.0.0.1:8765:8765 \
              -v scamshift-ci-state:/app/runtime "$IMAGE:$GITHUB_SHA"
          }
          start
          test "$(docker exec scamshift-ci id -u)" = 10001
          python3 .github/scripts/container_check.py save "$RUNNER_TEMP/active.json"
          docker rm -f scamshift-ci
          start
          python3 .github/scripts/container_check.py restore "$RUNNER_TEMP/active.json"
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Shrashti1234/ScamShift'
        run: |
          docker image inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA" > image-id.txt
          docker save "$IMAGE:$GITHUB_SHA" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Shrashti1234/ScamShift'
        with:
          name: verified-image
          path: |
            image.tar.gz
            image-id.txt
          compression-level: 0
          retention-days: 2

  publish:
    needs: [test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Shrashti1234/ScamShift'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-image
      - name: Load and confirm the verified image
        run: |
          docker load -i image.tar.gz
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")" = "$(cat image-id.txt)"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:$GITHUB_SHA")" = "$GITHUB_SHA"
      - name: Push full commit tag
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA" | tee "$RUNNER_TEMP/push.txt"
          digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/push.txt")
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE:$GITHUB_SHA\` at \`$digest\`." >> "$GITHUB_STEP_SUMMARY"

  publish-latest:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Shrashti1234/ScamShift'
    runs-on: ubuntu-latest
    concurrency:
      group: scamshift-ghcr-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Advance latest to the verified digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if pull=$(docker pull "$IMAGE:latest" 2>&1); then
            incumbent=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:latest")
            [[ "$incumbent" =~ ^[0-9a-f]{40}$ ]]
            order=$(gh api "repos/$GITHUB_REPOSITORY/compare/$incumbent...$GITHUB_SHA" --jq .status)
            if [[ "$order" != ahead && "$order" != identical ]]; then
              echo "Kept latest at $incumbent (comparison: $order)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          elif [[ "$pull" != *"manifest unknown"* && "$pull" != *"not found"* ]]; then
            echo "$pull" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          actual=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE:latest")
          test "$actual" = "\"$DIGEST\""
          echo "Latest resolves to \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
